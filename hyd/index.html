<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
/* Theme from the main page (light by default); when opened on its own, from the saved choice. */
(function () { var de = document.documentElement, m = 'light';
  try { if (window.parent !== window) { var p = window.parent.document.documentElement; m = p.hasAttribute('data-theme') ? p.getAttribute('data-theme') : 'system'; } else { m = localStorage.getItem('fmh.theme') || 'light'; } } catch (e) {}
  if (m === 'system') de.removeAttribute('data-theme'); else de.setAttribute('data-theme', m === 'dark' ? 'dark' : 'light'); })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hydraulics Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: lab console — controls | live diagram | worked solution, under a centered title block */
:root {
  --paper: #f2f5f6;
  --panel: #ffffff;
  --ink: #15242d;
  --muted: #5a6b75;
  --rule: #d3dce0;
  --accent: #d4612a;
  --accent-ink: #ffffff;
  --water: #2f86c4;
  --chip: #e8eef1;
  --err-bg: #fde8e6; --err: #a3281f;
  --warn-bg: #fff3d9; --warn: #8a5a00;
  --info-bg: #e6f1f9; --info: #1f5f8f;
  /* canvas palette */
  --c-bg: #fbfcfd; --c-grid: #e4eaee; --c-ink: #22323c; --c-muted: #6c7d87;
  --c-water: #3a90cc; --c-water-deep: #1c6aa3; --c-part: #0d3b5e; --c-foam: #ffffff;
  --c-egl: #d4612a; --c-hgl: #6b4fc8; --c-danger: #d23b3b; --c-ok: #2e8b57;
  --c-soil: #c8b79c; --c-wall: #33444f; --c-air: #fff4dc; --c-pipe: #8796a0;
  --f-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e161b; --panel: #142029; --ink: #e1eaee; --muted: #93a5af; --rule: #263642;
    --accent: #f08a50; --accent-ink: #1a0d05; --water: #57a9e0; --chip: #1c2b36;
    --err-bg: #3a1714; --err: #ffb4a8; --warn-bg: #352708; --warn: #f5cd7a; --info-bg: #10293b; --info: #9fd0f2;
    --c-bg: #111c23; --c-grid: #1f2e38; --c-ink: #d7e2e8; --c-muted: #8fa1ab;
    --c-water: #3d97d6; --c-water-deep: #79bdeb; --c-part: #e4f4ff; --c-foam: #ffffff;
    --c-egl: #f08a50; --c-hgl: #a88cff; --c-danger: #ff6b6b; --c-ok: #57c78a;
    --c-soil: #5d513f; --c-wall: #b9c7cf; --c-air: #2b2a22; --c-pipe: #6f808b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e161b; --panel: #142029; --ink: #e1eaee; --muted: #93a5af; --rule: #263642;
  --accent: #f08a50; --accent-ink: #1a0d05; --water: #57a9e0; --chip: #1c2b36;
  --err-bg: #3a1714; --err: #ffb4a8; --warn-bg: #352708; --warn: #f5cd7a; --info-bg: #10293b; --info: #9fd0f2;
  --c-bg: #111c23; --c-grid: #1f2e38; --c-ink: #d7e2e8; --c-muted: #8fa1ab;
  --c-water: #3d97d6; --c-water-deep: #79bdeb; --c-part: #e4f4ff; --c-foam: #ffffff;
  --c-egl: #f08a50; --c-hgl: #a88cff; --c-danger: #ff6b6b; --c-ok: #57c78a;
  --c-soil: #5d513f; --c-wall: #b9c7cf; --c-air: #2b2a22; --c-pipe: #6f808b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1680px; margin: 0 auto; }
header.top { display: flex; align-items: center; justify-content: center; gap: clamp(12px, 2vw, 24px); padding-block: 22px 10px; }
header.top .logo { flex: none; width: clamp(64px, 9vw, 112px); height: auto; aspect-ratio: 1; border-radius: 12px; background: #ffffff; box-shadow: 0 0 0 1px var(--rule); }
header.top .titles { text-align: left; min-width: 0; }
@media (max-width: 560px) { header.top { flex-direction: column; } header.top .titles { text-align: center; } }
header.top h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 4.4vw, 50px); letter-spacing: 0.01em; margin: 0; line-height: 1.02; text-wrap: balance; }
header.top h1 .by { color: var(--accent); }
header.top p { margin: 6px 0 0; font-family: var(--f-display); font-weight: 500; font-size: clamp(15px, 1.7vw, 20px); letter-spacing: 0.04em; color: var(--muted); text-wrap: balance; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; padding-block: 12px 0; border-bottom: 2px solid var(--rule); }
nav.tabs button { font-family: var(--f-display); font-size: 16px; font-weight: 600; letter-spacing: 0.02em; background: transparent; color: var(--muted); border: 0; border-bottom: 3px solid transparent; padding: 8px 12px 7px; margin-bottom: -2px; cursor: pointer; }
nav.tabs button .n { font-family: var(--f-mono); font-size: 11px; opacity: 0.7; margin-right: 6px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs button:hover { color: var(--ink); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 12px; }
.bar h2 { font-family: var(--f-display); font-size: 22px; font-weight: 600; margin: 0 auto 0 0; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 10px; font: 600 12px var(--f-body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
label.tog { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
select, input[type="number"] { font: 13px var(--f-body); color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 5px; padding: 4px 6px; }
input[type="number"] { font-family: var(--f-mono); width: 100%; min-width: 0; }
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr) 380px; gap: 16px; align-items: start; padding-bottom: 32px; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; min-width: 0; }
#left { padding: 12px 14px 16px; }
#right { padding: 12px 14px 16px; }
.ph { font-family: var(--f-display); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 6px 0 8px; }
.modes { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.modes button { text-align: left; border: 1px solid var(--rule); background: transparent; color: var(--ink); border-radius: 5px; padding: 6px 9px; font: 600 13px var(--f-body); cursor: pointer; }
.modes button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.prm { padding: 8px 0; border-top: 1px solid var(--rule); }
.grp { font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: 0.02em; margin-top: 12px; padding: 8px 0 2px; border-top: 2px solid var(--ink); }
.grp + .prm { border-top: 0; }
.prm-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.prm-h label { font-weight: 600; font-size: 13px; }
.prm-h .u { font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.prm-c { display: grid; grid-template-columns: minmax(0, 1fr) 92px; gap: 8px; align-items: center; margin-top: 4px; }
.prm-r { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.prm select { width: 100%; margin-top: 4px; }
input[type="range"] { width: 100%; accent-color: var(--accent); min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chips button { border: 1px solid var(--rule); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 2px 9px; font: 12px var(--f-body); cursor: pointer; }
.prm.check label { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 13px; cursor: pointer; }
#center { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.anim { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 10px; }
.anim button.b { border: 1px solid var(--rule); background: var(--panel); color: var(--ink); border-radius: 5px; padding: 5px 11px; font: 600 13px var(--f-body); cursor: pointer; min-width: 64px; }
.anim button.b.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.clock { font-family: var(--f-mono); font-size: 13px; margin-left: auto; font-variant-numeric: tabular-nums; }
.cv { padding: 0; overflow: hidden; }
canvas { display: block; width: 100%; touch-action: none; }
.hint { font-size: 12px; color: var(--muted); padding: 0 4px; }
.warns { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.w { border-radius: 6px; padding: 7px 10px; font-size: 13px; border-left: 4px solid; }
.w.err { background: var(--err-bg); color: var(--err); }
.w.warn { background: var(--warn-bg); color: var(--warn); }
.w.info { background: var(--info-bg); color: var(--info); }
table.res { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.res td { padding: 4px 0; border-bottom: 1px solid var(--rule); vertical-align: baseline; }
table.res td.v { text-align: right; font-family: var(--f-mono); font-size: 13px; white-space: nowrap; padding-left: 8px; }
table.res td.u { font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding-left: 6px; white-space: nowrap; }
table.res tr.em td { font-weight: 700; }
table.res tr.em td.v { color: var(--accent); }
.stephead { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
.copy { border: 1px solid var(--rule); background: var(--chip); color: var(--ink); border-radius: 5px; padding: 4px 10px; font: 600 12px var(--f-body); cursor: pointer; }
ol.steps { padding-left: 0; margin: 6px 0 0; list-style: none; counter-reset: s; }
ol.steps li { counter-increment: s; padding: 9px 0 9px 30px; border-top: 1px solid var(--rule); position: relative; }
ol.steps li::before { content: counter(s); position: absolute; left: 0; top: 9px; width: 22px; height: 22px; border-radius: 50%; background: var(--chip); font: 600 11px/22px var(--f-mono); text-align: center; color: var(--ink); }
.st-t { font-weight: 700; font-size: 13.5px; }
.st-f, .st-s { font-family: var(--f-mono); font-size: 12px; overflow-wrap: anywhere; }
.st-f { color: var(--ink); margin-top: 2px; }
.st-s { color: var(--muted); }
.st-r { font-family: var(--f-mono); font-size: 12.5px; font-weight: 600; color: var(--accent); }
.st-n { font-size: 12px; color: var(--muted); font-style: italic; }
.st-tab { overflow-x: auto; margin-top: 6px; }
.st-tab table { border-collapse: collapse; font-family: var(--f-mono); font-size: 11px; font-variant-numeric: tabular-nums; }
.st-tab th, .st-tab td { padding: 2px 7px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
sup { font-size: 0.75em; line-height: 0; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
footer { color: var(--muted); font-size: 12px; text-align: center; padding-block: 0 24px; }
@media (max-width: 1180px) {
  .layout { grid-template-columns: 290px minmax(0, 1fr); }
  #right { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  #left { order: 2; } #center { order: 1; } #right { order: 3; }
  .clock { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
<style>body{margin:0} .stephead .btns{display:flex;gap:6px} .stephead{flex-wrap:wrap;gap:8px} nav.tabs{padding-top:4px} [hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Modules"></nav>
  <div class="bar">
    <h2 id="modTitle">Module</h2>
    <div class="seg" role="group" aria-label="Units">
      <button id="uSI" aria-pressed="true">SI</button><button id="uEN" aria-pressed="false">English</button>
    </div>
    <label class="tog"><input type="checkbox" id="eglTog" checked> EGL / HGL</label>
    <select id="presetSel" aria-label="Load example"></select>
  </div>
  <main class="layout">
    <aside class="panel" id="left" aria-label="Inputs"></aside>
    <section id="center">
      <div class="panel anim">
        <button class="b primary" id="playBtn">Pause</button>
        <button class="b" id="resetBtn">Reset</button>
        <div class="seg" id="viewSeg" role="group" aria-label="Diagram view"><button id="v3d" aria-pressed="true">3D isometric</button><button id="v2d" aria-pressed="false">2D side view</button></div>
        <label class="tog">Speed
          <select id="speedSel">
            <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1">1×</option><option value="2">2×</option>
            <option value="5">5×</option><option value="20">20×</option><option value="100">100×</option>
          </select>
        </label>
        <span class="clock" id="clock">t = 0 s</span>
      </div>
      <div class="panel cv"><canvas id="cvMain" aria-label="Diagram and flow animation"></canvas></div>
      <div class="panel cv"><canvas id="cvAux" aria-label="Plots"></canvas></div>
      <div class="hint" id="hint"></div>
    </section>
    <aside class="panel" id="right" aria-label="Results and solution">
      <div class="warns" id="warns"></div>
      <div class="ph">Results</div>
      <table class="res" id="results"></table>
      <div class="stephead"><div class="ph" style="margin:0">Step-by-step solution</div><div class="btns"><button class="copy" id="copyBtn">Copy solution</button><button class="copy" id="pdfBtn">Print PDF</button></div></div>
      <ol class="steps" id="steps"></ol>
    </aside>
  </main>
  <footer>Formulas live in physics.js, separate from the drawing code. Values are rounded to 4 significant figures.</footer>
</div>
<script src="../vendor/html2canvas.min.js"></script>
<script src="../vendor/jspdf.umd.min.js"></script>
<script src="../report.js"></script>
<script src="physics.js"></script>
<script src="app.js"></script>

</body>
</html>
