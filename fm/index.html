<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluid Mechanics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Modules"></nav>
  <div class="bar">
    <h2 id="modTitle">Module</h2>
    <div class="seg" role="group" aria-label="Units">
      <button type="button" id="uSI" aria-pressed="true">SI</button><button type="button" id="uEN" aria-pressed="false">English</button>
    </div>
    <label class="tog"><input type="checkbox" id="showP" checked> Pressure diagram</label>
    <select id="examples" aria-label="Load example"></select>
  </div>
  <main class="layout">
    <aside class="panel" id="controlsPanel" aria-label="Inputs">
      <div class="ph">Inputs</div>
      <div id="controls"></div>
    </aside>
    <section id="center">
      <div class="panel anim">
        <div id="statusPill" class="pill"></div>
        <div class="seg" id="viewSeg" role="group" aria-label="Diagram view">
          <button type="button" data-v="2d" class="on" aria-pressed="true">2D section</button><button type="button" data-v="3d" aria-pressed="false">3D isometric</button>
        </div>
        <button type="button" id="resetIso" class="btn small" hidden>Reset to isometric</button>
      </div>
      <div class="panel cv">
        <div class="canvas-wrap">
          <svg id="svg2d" xmlns="http://www.w3.org/2000/svg"></svg>
          <canvas id="cv3d" hidden></canvas>
        </div>
        <div class="legend">
          <span><i style="background:#16a085"></i>CG centroid</span>
          <span><i style="background:#c0392b"></i>CP / force</span>
          <span><i style="background:#2980b9"></i>B buoyancy / uplift</span>
          <span><i style="background:#8e44ad"></i>M metacentre / soil pressure</span>
          <span><i style="background:#e74c3c;opacity:.4"></i>pressure diagram</span>
        </div>
      </div>
      <div class="hint">3D view: drag to rotate, scroll to zoom. Values are rounded to 4 significant figures.</div>
    </section>
    <aside class="panel" id="right" aria-label="Results and solution">
      <div id="msgs"></div>
      <div class="ph">Results</div>
      <table class="results" id="results"></table>
      <div class="stephead">
        <div class="ph" style="margin:0">Step-by-step solution</div>
        <div class="btns"><button type="button" class="copy" id="copySol">Copy solution</button><button type="button" class="copy" id="pdfSol">Print PDF</button></div>
      </div>
      <ol class="steps" id="steps"></ol>
    </aside>
  </main>
</div>
  <script src="../vendor/html2canvas.min.js"></script>
  <script src="../vendor/jspdf.umd.min.js"></script>
  <script src="../report.js"></script>
  <script src="physics.js"></script>
  <script src="physics2.js"></script>
  <script src="ui.js"></script>
  <script src="iso3d.js"></script>
  <script src="mod1.js"></script>
  <script src="mod2.js"></script>
  <script src="mod3.js"></script>
  <script src="modV.js"></script>
  <script src="modP.js"></script>
  <script src="modD.js"></script>
  <script src="app.js"></script>
</body>
</html>
