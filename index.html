<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluid Mechanics &amp; Hydraulics Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root {
  --paper: #f2f5f6; --panel: #ffffff; --ink: #15242d; --muted: #5a6b75; --rule: #d3dce0;
  --accent: #d4612a; --accent-ink: #ffffff; --tab-bg: #e8eef1;
  --f-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e161b; --panel: #142029; --ink: #e1eaee; --muted: #93a5af; --rule: #263642;
    --accent: #f08a50; --accent-ink: #1a0d05; --tab-bg: #1c2b36; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e161b; --panel: #142029; --ink: #e1eaee; --muted: #93a5af; --rule: #263642;
  --accent: #f08a50; --accent-ink: #1a0d05; --tab-bg: #1c2b36; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); display: flex; flex-direction: column; min-height: 100dvh; }
header.app {
  display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  background: var(--panel); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; padding-bottom: 12px; margin-right: auto; }
.brand img { flex: none; width: 64px; height: 64px; display: block; object-fit: contain; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 3vw, 34px); line-height: 1.02; letter-spacing: 0.01em; text-wrap: balance; }
.brand p.by { margin-top: 1px; color: var(--accent); font-weight: 600; }
.brand p { margin: 4px 0 0; font-family: var(--f-display); font-weight: 500; font-size: clamp(13px, 1.4vw, 16px); letter-spacing: 0.04em; color: var(--muted); }
nav.disc { display: flex; gap: 6px; align-self: flex-end; }
nav.disc button {
  font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: 0.02em;
  border: 1px solid var(--rule); border-bottom: 0; border-radius: 10px 10px 0 0;
  background: var(--tab-bg); color: var(--muted); padding: 10px 20px 9px; cursor: pointer;
  display: flex; align-items: center; gap: 8px; position: relative; top: 1px;
}
nav.disc button svg { width: 20px; height: 20px; flex: none; }
nav.disc button:hover { color: var(--ink); }
nav.disc button[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: inset 0 3px 0 var(--accent); }
nav.disc button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { flex: 1; position: relative; min-height: 0; }
main iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--paper); }
main iframe[hidden] { display: none; }
@media (max-width: 720px) {
  .brand img { width: 52px; height: 52px; }
  nav.disc { width: 100%; }
  nav.disc button { flex: 1; justify-content: center; font-size: 16px; padding: 9px 8px 8px; white-space: nowrap; }
  nav.disc button svg { display: none; }
  main { min-height: 80dvh; }
}
</style>
</head>
<body>
<header class="app">
  <div class="brand">
    <img src="logo.png" width="64" height="64" alt="ACI Philippines T.I.P. Quezon City Student Chapter logo">
    <div>
      <h1>Fluid Mechanics &amp; Hydraulics Engineering</h1>
      <p>American Concrete Institute Philippines T.I.P. QC Student Chapter</p>
      <p class="by">by CEM Jumawan</p>
    </div>
  </div>
  <nav class="disc" role="tablist" aria-label="Discipline">
    <button role="tab" id="tab-fm" aria-controls="pane-fm" data-pane="fm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18v16H3z"/><path d="M3 10c3 0 3 1.5 6 1.5S12 10 15 10s3 1.5 6 1.5"/><path d="M12 13v5m-2.5-2.5L12 18l2.5-2.5"/></svg>
      Fluid Mechanics
    </button>
    <button role="tab" id="tab-hyd" aria-controls="pane-hyd" data-pane="hyd">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8h8v8H2z"/><path d="M10 12h12"/><path d="M14 9.5l2.5 2.5-2.5 2.5"/><path d="M2 11c2 0 2 1 4 1s2-1 4-1"/></svg>
      Hydraulics Engineering
    </button>
  </nav>
</header>
<main>
  <iframe id="pane-fm" role="tabpanel" aria-labelledby="tab-fm" title="Fluid Mechanics solver" data-src="fm/index.html" hidden></iframe>
  <iframe id="pane-hyd" role="tabpanel" aria-labelledby="tab-hyd" title="Hydraulics Engineering solver" data-src="hyd/index.html" hidden></iframe>
</main>
<script>
(function () {
  'use strict';
  var KEY = 'fmh.tab';
  var tabs = Array.prototype.slice.call(document.querySelectorAll('nav.disc button'));
  function store(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  function stored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }

  // Pass the page theme (light/dark override) to the embedded solvers.
  function syncTheme(fr) {
    try {
      var d = fr.contentDocument && fr.contentDocument.documentElement; if (!d) return;
      var t = document.documentElement.getAttribute('data-theme');
      if (t) d.setAttribute('data-theme', t); else d.removeAttribute('data-theme');
    } catch (e) {}
  }
  function frames() { return Array.prototype.slice.call(document.querySelectorAll('main iframe')); }

  function select(id) {
    if (id !== 'fm' && id !== 'hyd') id = 'fm';
    tabs.forEach(function (b) {
      var on = b.dataset.pane === id;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
    });
    frames().forEach(function (fr) {
      var on = fr.id === 'pane-' + id;
      if (on && !fr.getAttribute('src')) {
        fr.addEventListener('load', function () { syncTheme(fr); });
        fr.setAttribute('src', fr.dataset.src);
      }
      fr.hidden = !on;
      if (on) { try { fr.contentWindow && fr.contentWindow.dispatchEvent(new Event('resize')); } catch (e) {} }
    });
    store(id);
    if (location.hash !== '#' + id) { try { history.replaceState(null, '', '#' + id); } catch (e) {} }
  }

  tabs.forEach(function (b, i) {
    b.addEventListener('click', function () { select(b.dataset.pane); });
    b.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
      n.focus(); select(n.dataset.pane);
    });
  });
  new MutationObserver(function () { frames().forEach(syncTheme); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // The solvers hand generated PDFs to this page, which owns the viewer's download permission.
  // The PDF arrives as a Blob made inside the solver's frame; copy it into a Blob of this page
  // first, because the viewer's save call does not accept objects from another frame.
  window.FMH_save = async function (filename, blob) {
    var d = null;
    try { if (window.claude && typeof window.claude.use === 'function') d = await window.claude.use('downloads'); } catch (e) { d = null; }
    if (!d) return { status: 'none' };
    var buf = await blob.arrayBuffer();
    var tries = [
      function () { return new Blob([new Uint8Array(buf)], { type: 'application/pdf' }); },
      function () { var u = new Uint8Array(buf.byteLength); u.set(new Uint8Array(buf)); return u.buffer; }
    ];
    var code = 'unavailable';
    for (var i = 0; i < tries.length; i++) {
      try { await d.save({ filename: filename, data: tries[i]() }); return { status: 'saved' }; }
      catch (e) {
        code = (e && e.code) || 'unavailable';
        if (code === 'declined' || code === 'rate_limited') return { status: 'declined', code: code };
        if (code !== 'bad_request' && code !== 'transform_error') break;
      }
    }
    return { status: 'failed', code: code };
  };

  // Last resort: a plain download link clicked from this page.
  window.FMH_link = function (filename, blob) {
    try {
      var url = URL.createObjectURL(new Blob([blob], { type: 'application/pdf' }));
      var a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      return true;
    } catch (e) { return false; }
  };

  var start = (location.hash || '').slice(1) || stored() || 'fm';
  select(start);
})();
</script>
</body>
</html>
